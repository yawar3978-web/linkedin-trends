name: weekly-drafts

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 3:00 UTC = 8:30 AM IST
  workflow_dispatch:       # lets you also start it by hand

permissions:
  contents: write

concurrency:
  group: linkedin-queue
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write drafts and send them to Telegram
        run: python pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save progress
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add queue.json drafts_cache.json
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "update drafts"
            git pull --rebase
            git push
          fi