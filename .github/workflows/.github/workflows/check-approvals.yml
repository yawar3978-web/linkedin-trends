name: check-approvals

on:
  schedule:
    - cron: "*/30 3-17 * * *"   # every 30 min, 8:30 AM to 11:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check your Approve taps and post approved drafts
        run: python publisher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_TOKEN_DATE: ${{ secrets.LINKEDIN_TOKEN_DATE }}

      - name: Save progress
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add queue.json
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "update queue"
            git pull --rebase
            git push
          fi